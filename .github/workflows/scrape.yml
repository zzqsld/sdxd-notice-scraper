name: Scrape and Generate Word

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 9 * * *' # 每天 UTC 9:00 (北京时间 17:00) 运行，可根据需要调整
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: 'Choose full crawl or incremental crawl'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      download_images:
        description: 'Whether to keep image links in Word output'
        required: true
        default: 'yes'
        type: choice
        options:
          - yes
          - no

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
      env:
        SCRAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.crawl_mode || 'incremental' }}
        DOWNLOAD_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.download_images || 'yes' }}
      run: python headless_runner.py

    - name: Keep only latest 3 output docs
      run: |
        set -e
        if [ -d "output" ]; then
          python - <<'PY'
from pathlib import Path
import re

root = Path("output")
pattern = re.compile(r"_(\d{8}_\d{6})\.docx$")
groups = {}

for path in root.glob("*.docx"):
    match = pattern.search(path.name)
    if not match:
        continue
    groups.setdefault(match.group(1), []).append(path)

latest_groups = set(sorted(groups, reverse=True)[:3])
for timestamp, paths in groups.items():
    if timestamp not in latest_groups:
        for path in paths:
            path.unlink(missing_ok=True)
PY
        fi

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        # 添加 history.json 和 output 目录下的所有变更（包含删除）
        git add -A history.json output
        
        # 检查是否有暂存的更改
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update scrape results $(date +'%Y-%m-%d %H:%M')"
          git push
        fi
